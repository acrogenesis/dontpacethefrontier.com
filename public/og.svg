<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0c10"/>
      <stop offset="55%" stop-color="#12141a"/>
      <stop offset="100%" stop-color="#1a1208"/>
    </linearGradient>
    <linearGradient id="glow" x1="80%" y1="0%" x2="100%" y2="40%">
      <stop offset="0%" stop-color="#e85d04" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e85d04" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e85d04"/>
      <stop offset="100%" stop-color="#ff9f1c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Speed lines -->
  <g opacity="0.07" stroke="#f5f2eb" stroke-width="1">
    <line x1="-40" y1="80" x2="1240" y2="40"/>
    <line x1="-40" y1="140" x2="1240" y2="90"/>
    <line x1="-40" y1="200" x2="1240" y2="145"/>
    <line x1="-40" y1="260" x2="1240" y2="200"/>
    <line x1="-40" y1="320" x2="1240" y2="255"/>
    <line x1="-40" y1="380" x2="1240" y2="310"/>
    <line x1="-40" y1="440" x2="1240" y2="365"/>
    <line x1="-40" y1="500" x2="1240" y2="420"/>
    <line x1="-40" y1="560" x2="1240" y2="475"/>
  </g>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="10" height="630" fill="url(#accent)"/>

  <!-- Badge -->
  <rect x="80" y="120" width="280" height="40" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(245,242,235,0.18)" stroke-width="1"/>
  <text x="220" y="146" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" letter-spacing="2.4" fill="#ff9f1c">COMMUNITY STATEMENT</text>

  <!-- Title -->
  <text x="80" y="250" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#f5f2eb">Don't Pace the Frontier</text>

  <!-- Accent underline -->
  <rect x="80" y="275" width="120" height="5" rx="2" fill="#e85d04"/>

  <!-- Description -->
  <text x="80" y="350" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="500" fill="#e7e2d9">Ship the best AI models at breakneck speed.</text>
  <text x="80" y="395" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="500" fill="#e7e2d9">Reasonable prices. Stop the fearmongering.</text>

  <!-- Footer line -->
  <line x1="80" y1="500" x2="1120" y2="500" stroke="rgba(245,242,235,0.12)" stroke-width="1"/>
  <text x="80" y="545" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="500" fill="#a8a29a">dontpacethefrontier.com</text>
  <text x="1120" y="545" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#ff9f1c">Sign with X</text>
</svg>
